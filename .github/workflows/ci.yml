name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run pytest -m "not (audio or model or windows_only or slow or release)"
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      # The Windows pass again, here, because only here is comtypes installed.
      # The linux job's Windows pass cannot resolve Windows-only dependencies,
      # so pyright types everything reached through them as Unknown and checks
      # none of it (ADR-019 § Headless audio/video).
      - run: uv run pyright --pythonplatform Windows
      - run: uv run pytest -m "not (audio or no_audio_output or model or slow or release)"
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
      # What a runner can prove of the `audio` tier: the pygame.mixer cues pass
      # under the dummy driver. The SAPI half cannot run here -- SpVoice.Speak
      # raises COMError 0x8004503A, a runner has no audio output -- so
      # tests/test_sapi_tts.py is verified by hand on Windows hardware and by
      # nothing else (ADR-019). Found by the windows-audio-probe job this
      # replaces (alpha session 12a-2).
      - run: uv run pytest tests/test_cues.py -m audio
        env:
          SDL_AUDIODRIVER: dummy
      # The same missing device, turned into a test: the runner is the one
      # machine that reproduces "a voice in the registry and no way to play
      # it", which is what the startup output check exists to refuse.
      - run: uv run pytest -m no_audio_output
