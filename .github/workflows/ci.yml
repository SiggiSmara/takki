name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run pytest -m "not (audio or model or windows_only or slow or release)"
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest -m "not (audio or model or slow or release)"
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy

  # A probe, not a gate (alpha session 12a-2). No runner has ever executed the
  # `audio` marker: both jobs above exclude it, so eleven sessions of TTS and
  # mixer code have only ever run on one laptop. Whether a GitHub runner has
  # enough of a sound device to build a SAPI voice and hear it back is an
  # empirical question, and this job is how it gets asked. #12a-1 proved the
  # other half of the strategy -- LoadKeyboardLayout let a runner exercise
  # hardware-shaped code it did not have.
  #
  # continue-on-error because the answer is unknown: a red probe must not block
  # a branch while it is still a question. Read the first run, then either drop
  # continue-on-error and fold `-m audio` into the windows job, or delete this
  # job and record in ADR-019 that the tier is laptop-only. Do not leave it
  # here indefinitely in this state.
  #
  # First run, 2026-09-20 -- partial answer, and it was worth asking. The
  # `pygame.mixer` cue tests PASS on a runner under SDL_AUDIODRIVER=dummy. The
  # TTS half never got an answer, because the pyttsx3 test hung the job; that
  # test no longer runs on Windows and SapiTTS is now bounded, so the next run
  # is the one that answers whether a runner can drive a real SAPI voice.
  windows-audio-probe:
    runs-on: windows-latest
    continue-on-error: true
    # Bounded because the first run (2026-09-20) did not fail, it HUNG: pyttsx3's
    # runAndWait() polls for a completion event SAPI never fires when there is no
    # usable audio endpoint, so the job sat at 8.5 minutes on one `speak("a")`
    # and had to be cancelled by hand. Both halves of that are now fixed --
    # FallbackTTS is skipped on Windows (it is the Linux dev path) and SapiTTS
    # abandons an utterance after 60 s -- but a probe asking "what can a runner
    # do" must not be able to burn the job limit finding out.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: Which SAPI voices does a runner have?
        run: uv run python -c "from takki.platform.windows import installed_voices; print(installed_voices())"
      - run: uv run pytest -m "audio" -v
        env:
          SDL_AUDIODRIVER: dummy
